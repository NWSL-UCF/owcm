[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "OWCM"
version = "0.1.0"
description = "Optical Wireless Communication Channel Model Library"
readme = "README.md"
authors = [
  { name="Research Team", email="research@example.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.7"
dependencies = [
    "numpy",
    "scipy",
]

[project.urls]
"Homepage" = "https://github.com/example/owcm"
"Bug Tracker" = "https://github.com/example/owcm/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["owcm*"]
